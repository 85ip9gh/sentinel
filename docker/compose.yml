name: sentinel

services:
  kafka:
    image: apache/kafka:${KAFKA_VERSION:-3.9.0}
    container_name: sentinel-kafka
    restart: unless-stopped
    ports:
      # Local clients on the workstation itself.
      - "127.0.0.1:9092:9092"
      # Remote collectors, reachable over the tailnet only. The ":?" form makes
      # Compose refuse to start when the variable is empty, rather than binding
      # 0.0.0.0 and putting an unauthenticated broker on the LAN.
      - "${SENTINEL_TAILNET_IP:?set SENTINEL_TAILNET_IP in docker/.env}:9094:9094"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-sentinel-single-node-0001}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Bind every interface with the empty-host form, never "0.0.0.0". This
      # image's setup step fails with "advertised.listeners cannot use the
      # nonroutable meta-address 0.0.0.0" when the bind address is spelled out,
      # even though advertised.listeners is set separately and contains no such
      # address. The error names the wrong property, so it reads as a mistake in
      # the advertised list rather than in the bind list.
      #
      # Three client listeners, because a client is told to reconnect to the
      # advertised address and the three kinds of client sit in different
      # networks. HOST is for processes on this machine reaching the published
      # port, DOCKER is for containers on this compose network, and TAILNET is
      # for collectors on other machines.
      KAFKA_LISTENERS: HOST://:9092,TAILNET://:9094,DOCKER://:9095,CONTROLLER://:9093
      # HOST advertises 127.0.0.1 rather than localhost, because a Windows
      # client resolves localhost to ::1 first and the published port is IPv4
      # only, so every connection paid a two second timeout before falling back.
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:9092,TAILNET://${SENTINEL_TAILNET_IP}:9094,DOCKER://kafka:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,TAILNET:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Kafka is the transport, not the archive. HDFS holds history from step 2,
      # so a week of buffer here is plenty.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  topics:
    image: apache/kafka:${KAFKA_VERSION:-3.9.0}
    container_name: sentinel-topics
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        for topic in sentinel.system sentinel.http sentinel.container; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9095 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 3 --replication-factor 1 \
            --config retention.ms=604800000 --config compression.type=producer
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9095 --list

volumes:
  kafka-data:
